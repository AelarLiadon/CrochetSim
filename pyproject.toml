[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crochetsim"
description = "Represent crochet patterns as graphs and embed them in 3D as unit-edge meshes."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dynamic = ["version"]
keywords = ["crochet", "graph embedding", "computational geometry", "mesh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "networkx>=3.2",
    "scipy>=1.11",
]

[project.optional-dependencies]
view = ["matplotlib>=3.7", "plotly>=5.18"]
dev = [
    "crochetsim[view]",
    "pytest>=8",
    "pytest-cov",
    "import-linter>=2",
    "ruff>=0.6",
    "mypy>=1.11",
    "build",
    "twine",
]
docs = [
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.25",
    # pymdown-extensions 12.2 made Highlight.__init__'s `md` argument required,
    # and mkdocstrings does not pass it, so the docs build crashes without this.
    "pymdown-extensions<12.2",
]
all = ["crochetsim[view,dev,docs]"]

[project.urls]
Homepage = "https://github.com/AelarLiadon/CrochetSim"
Repository = "https://github.com/AelarLiadon/CrochetSim"
Issues = "https://github.com/AelarLiadon/CrochetSim/issues"

[tool.hatch.version]
path = "src/crochetsim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crochetsim"]

[tool.hatch.build.targets.sdist]
include = ["src/crochetsim", "tests", "docs", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["src/crochetsim"]
# networkx, scipy, plotly and mpl_toolkits ship no stubs, and are used through
# their documented runtime API rather than a typed surface.
ignore_missing_imports = true
warn_unused_ignores = true


# Import linting contracts to enforce architecture choices

[tool.importlinter]
root_packages = ["crochetsim"]

[[tool.importlinter.contracts]]
name = "crochetsim layers"
id = "crochetsim-layers"
type = "layers"
# a layer may import the ones below it, but not above.
# "a | b: modules on the same layer are mutually independent.
layers = [
    "crochetsim.api",
    "crochetsim.display | crochetsim.embedding",
    "crochetsim.metrics",
    "crochetsim.pattern | crochetsim.examples",
    "crochetsim._errors",
]
