[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crochetsim"
description = "Represent crochet patterns as graphs and embed them in 3D as unit-edge meshes."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
keywords = ["crochet", "graph embedding", "computational geometry", "mesh"]
dependencies = [
    "numpy>=1.24",
    "networkx>=3.2",
    "scipy>=1.11",
]

# [project.urls] - add the real repository URL before publishing.

[tool.hatch.version]
path = "src/crochetsim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crochetsim"]

[tool.hatch.build.targets.sdist]
include = ["src/crochetsim", "tests", "README.md"]
