[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crochetsim"
description = "Represent crochet patterns as graphs and embed them in 3D as unit-edge meshes."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
keywords = ["crochet", "graph embedding", "computational geometry", "mesh"]
dependencies = [
    "numpy>=1.24",
    "networkx>=3.2",
    "scipy>=1.11",
]

[project.optional-dependencies]
view = ["matplotlib>=3.7", "plotly>=5.18"]
dev = [
    "crochetsim[view]",
    "pytest>=8",
    "pytest-cov",
    "import-linter>=2",
    "ruff>=0.6",
    "mypy>=1.11",
    "build",
    "twine",
]
docs = ["mkdocs-material>=9", "mkdocstrings[python]>=0.25"]
all = ["crochetsim[view,dev,docs]"]

# [project.urls] - add the real repository URL before publishing.

[tool.hatch.version]
path = "src/crochetsim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crochetsim"]

[tool.hatch.build.targets.sdist]
include = ["src/crochetsim", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["src/crochetsim"]
# networkx, scipy, plotly and mpl_toolkits ship no stubs, and are used through
# their documented runtime API rather than a typed surface.
ignore_missing_imports = true
warn_unused_ignores = true
