name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages site per repository, so the docs and the demo ship together in a
# single artifact.  The demo is an ordinary page of the documentation, generated
# into docs/demo/ before MkDocs runs, so there is no ordering trap to fall into.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync --extra docs --extra view
      # The demo is a documentation page, so it is generated before MkDocs runs.
      - name: Build the interactive demo
        run: uv run python scripts/build_demo.py
      - name: Build the documentation
        run: uv run mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
